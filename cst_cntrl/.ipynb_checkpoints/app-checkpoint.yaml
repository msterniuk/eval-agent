runtime: python
env: flexible
threadsafe: true
entrypoint: gunicorn --timeout 120 -b :$PORT main:app
runtime_config:
  operating_system: "ubuntu22"
  runtime_version: "3.12"
service: txtanalcstcntrl
instance_class: F1
inbound_services:
- warmup
network:
  instance_tag: txtanalyinstancetest
  name: projects/host-project-1aa7/global/networks/gcp-network-vpc-1
  subnetwork_name: prod-subnet
automatic_scaling:
  max_idle_instances: automatic
  min_pending_latency: automatic
  max_pending_latency: automatic
  max_concurrent_requests: 50
  min_num_instances: 1
  max_num_instances: 5
  cpu_utilization:
    target_utilization: 0.65
resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 15
liveness_check:
  initial_delay_sec: '300'
  check_interval_sec: '30'
  timeout_sec: '4'
  failure_threshold: 4
  success_threshold: 2
readiness_check:
  check_interval_sec: '5'
  timeout_sec: '4'
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: '300'